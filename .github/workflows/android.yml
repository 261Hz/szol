name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: szol-android-debug
          path: android/**/*.apk
          retention-days: 14

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk szol-debug.apk

      - name: Publish to GitHub Releases (rolling android-latest tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android (latest debug build)
          prerelease: true
          files: szol-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
